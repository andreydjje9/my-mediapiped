name: Build MediaPipe APK
on: [workflow_dispatch] # Запуск вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bazel
        run: |
          sudo apt-get update
          sudo apt-get install bazel-6.1.1

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Build Hand Tracking APK
        run: |
          # Это команда сборки примера с руками (GPU версия)
          bazel build -c opt --config=android_arm64 mediapipe/examples/android/src/java/com/google/mediapipe/apps/handtrackinggpu:handtrackinggpu
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-hand-apk
          path: bazel-bin/mediapipe/examples/android/src/java/com/google/mediapipe/apps/handtrackinggpu/handtrackinggpu.apk
